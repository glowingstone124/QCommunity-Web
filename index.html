<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.svg" style="--stroke-width:100">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>QHub</title>
    <script>
      // Apply saved UI mode, color scheme, and locale before first paint to prevent FOUC.
      try {
        var metaColorScheme = document.querySelector('meta[name="color-scheme"]');
        var savedTheme = localStorage.getItem('theme');
        var prefersDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (savedTheme === 'dark' || savedTheme === 'light') {
          if (metaColorScheme) metaColorScheme.content = savedTheme;
          document.documentElement.dataset.theme = savedTheme;
        } else {
          if (metaColorScheme) metaColorScheme.content = 'light dark';
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
        }
        var savedUi = localStorage.getItem('qhub.ui-mode');
        document.documentElement.dataset.ui = savedUi === 'classic' ? 'classic' : 'modern';
        document.documentElement.lang = localStorage.getItem('locale') === 'en' ? 'en' : 'zh-CN';
      } catch (e) {
        document.documentElement.dataset.theme = document.documentElement.dataset.theme || 'light';
        document.documentElement.dataset.ui = document.documentElement.dataset.ui || 'modern';
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
      }

      :root[data-theme="light"] {
        color-scheme: light;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      #asset-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #0f172a;
        font-family: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), visibility 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      #asset-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .asset-loader__panel {
        width: min(320px, calc(100vw - 48px));
      }

      .asset-loader__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .asset-loader__brand {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }

      .asset-loader__percent {
        min-width: 4ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #2563eb;
        font-weight: 700;
      }

      .asset-loader__track {
        height: 6px;
        overflow: hidden;
        background: #e2e8f0;
      }

      .asset-loader__bar {
        width: 0%;
        height: 100%;
        background: #2563eb;
        transition: width 160ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        #asset-loader,
        .asset-loader__bar {
          transition-duration: 1ms;
        }
      }

      :root[data-theme="dark"] body,
      :root[data-theme="dark"] #asset-loader {
        background: #090c12;
        color: #f1f5f9;
      }

      :root[data-theme="dark"] .asset-loader__track {
        background: #1c2635;
      }

      :root[data-theme="dark"] .asset-loader__percent {
        color: #93c5fd;
      }

      :root[data-theme="dark"] .asset-loader__bar {
        background: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div id="asset-loader" role="status" aria-live="polite" aria-label="Loading assets">
      <div class="asset-loader__panel">
        <div class="asset-loader__header">
          <p class="asset-loader__brand">QHub</p>
          <span id="asset-loader-percent" class="asset-loader__percent">0%</span>
        </div>
        <div class="asset-loader__track" aria-hidden="true">
          <div id="asset-loader-bar" class="asset-loader__bar"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
